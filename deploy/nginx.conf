server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  charset utf-8;
  charset_types text/plain text/markdown application/xml text/xml;

  error_page 404 /live-deck/404.html;

  location = / {
    return 302 /live-deck/;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Markdown copies of the docs pages, for agents.
  location ~* \.md$ {
    default_type text/markdown;
    add_header Cache-Control "no-cache";
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  location ~* ^/[^/]+/(assets|fonts)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
