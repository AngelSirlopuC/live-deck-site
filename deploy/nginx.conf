server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = / {
    return 302 /live-deck/;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  location ~* ^/[^/]+/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
