name: projects
services:
  projects-web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/live-deck/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [visoria]
networks:
  visoria:
    external: true
    name: visoria_default
